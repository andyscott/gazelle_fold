name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Verify MODULE.bazel is tidy
        run: |
          bazel mod tidy
          git diff --exit-code -- MODULE.bazel MODULE.bazel.lock

      - name: Test
        run: bazel test --lockfile_mode=error //...

      - name: Verify generated BUILD files
        run: bazel run --lockfile_mode=error //:gazelle_ci

      - name: Test downstream Bzlmod example
        working-directory: examples/bzlmod
        run: |
          bazel mod tidy
          git diff --exit-code -- MODULE.bazel
          bazel build @gazelle_fold//:gazelle_fold
          bazel test //...
